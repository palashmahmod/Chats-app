<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>প্রাইভেট চ্যাট</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- লগইন সেকশন (গুগল অটোফিল ও সেভ পপ-আপ মুক্ত) -->
  <div id="login-screen" class="screen">
    <h2>লগইন করুন</h2>
    <input type="text" id="email" name="user_login_field_x9" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" readonly onfocus="this.removeAttribute('readonly');" placeholder="ইমেইল দিন">
    
    <input type="text" id="password" class="masked-password" name="user_secret_field_z4" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" readonly onfocus="this.removeAttribute('readonly');" placeholder="পাসওয়ার্ড দিন">
    
    <button type="button" onclick="login()">লগইন</button>
    <p id="auth-error"></p>
  </div>

  <!-- চ্যাট সেকশন -->
  <div id="chat-screen" class="screen hidden">
    
    <!-- ১. উপরে ফ্রিজ থাকা হেডার -->
    <div class="chat-header">
      <div id="user-display">চ্যাট রুম</div>
      <button onclick="logout()">লগআউট</button>
    </div>

    <!-- ২. হেডারের নিচে সিলেকশন ও ডিলিট বার -->
    <div id="selection-bar" class="selection-bar hidden">
      <span id="selected-count">০ টি</span>
      <div class="selection-actions">
        <button id="select-all-btn" onclick="toggleSelectAll()">☑️ All</button>
        <button onclick="deleteSelectedMessages()">🗑️ ডিলিট</button>
        <button onclick="cancelSelection()">✖ বাতিল</button>
      </div>
    </div>

    <!-- ৩. মাঝখানের মেসেজ বক্স -->
    <div id="messages-container"></div>

    <!-- ৪. মেসেজ লেখার বক্সের ঠিক উপরে রিপ্লাই প্রিভিউ -->
    <div id="reply-preview-bar" class="reply-bar hidden">
      <div class="reply-content">
        <small>রিপ্লাই দেওয়া হচ্ছে:</small>
        <p id="reply-text"></p>
      </div>
      <button class="cancel-reply-btn" onclick="cancelReply()">✖</button>
    </div>

    <!-- ৫. নিচে ফ্রিজ থাকা মেসেজ লেখার বক্স -->
    <div class="chat-input-area">
      <span class="media-btn" onclick="triggerFileInput()">📎</span>
      <input type="file" id="file-input" accept="image/*,video/*" style="display:none;" onchange="handleFileUpload(event)">
      <textarea id="message-input" rows="1" placeholder="মেসেজ লিখুন..." oninput="autoResizeTextarea(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
